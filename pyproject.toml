[project]
name = "selfindex"
version = "0.1.0"
description = "Personal RAG workspace for archived conversations and future LLM-powered APIs."
requires-python = ">=3.10,<3.14"
dependencies = [
    "bleach>=6.3.0",
    "chromadb>=1.5.5",
    "flask>=3.1.3",
    "ijson>=3.5.0",
    "jupyterlab>=4.5.6",
    "langchain-huggingface>=1.2.1",
    "markdown>=3.10.2",
    "pyside6-essentials>=6.11.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.3.0",
    "sqlcipher3-wheels>=0.5.7",
    "torch>=2.10.0",
    "waitress>=3.0.2",
]
